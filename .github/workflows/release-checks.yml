name: Release checks

on:
  pull_request:
  push:
    branches:
      - main
      - release/1.0-app-store
  workflow_dispatch:

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Install project-generation tools
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install xcodegen
          if ! command -v zstd >/dev/null 2>&1; then brew install zstd; fi

      - name: Generate project and verify bundled toolchain hashes
        run: scripts/bootstrap.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Crabrix.xcodeproj \
            -scheme Crabrix \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Run fast release suite
        run: |
          simulator_id="$(scripts/select-ios-simulator.sh)"
          xcodebuild test \
            -project Crabrix.xcodeproj \
            -scheme Crabrix \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Release candidate
        run: |
          xcodebuild build \
            -project Crabrix.xcodeproj \
            -scheme Crabrix \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$PWD/DerivedDataCI" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify the Release binary contains no online path
        run: |
          APP="$PWD/DerivedDataCI/Build/Products/Release-iphonesimulator/Crabrix.app/Crabrix"
          test -f "$APP" || { echo "no Release binary at $APP" >&2; exit 1; }
          if strings "$APP" | grep -q "crabrix.com/api"; then
            echo "a first-party service endpoint is present in a production build" >&2
            exit 1
          fi
          if otool -L "$APP" | grep -qi GameKit; then
            echo "GameKit is linked into a production build" >&2
            exit 1
          fi
          if strings "$APP" | grep -Fq 'Every Rust program starts at main, but the lesson is the whole loop.'; then
            echo "legacy Swift Academy content is present in the production executable" >&2
            exit 1
          fi
          if strings "$APP" | grep -qi "GKLocalPlayer\|GKGameCenterViewController"; then
            echo "Game Center symbols are present in a production build" >&2
            exit 1
          fi
          echo "Release binary carries no service endpoint and no Game Center path"

  compiler-gates:
    # Full bundled-rustc/Cargo runs are deliberately separate from every PR.
    # Run this workflow manually for an integration candidate; main/release
    # pushes also exercise the gate after the reviewed changes land.
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install project-generation tools
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install xcodegen
          if ! command -v zstd >/dev/null 2>&1; then brew install zstd; fi

      - name: Generate project and verify bundled toolchain hashes
        run: scripts/bootstrap.sh

      - name: Run bundled rustc and sandbox gates
        run: |
          simulator_id="$(scripts/select-ios-simulator.sh)"
          xcodebuild test \
            -project Crabrix.xcodeproj \
            -scheme CrabrixCompilerGate \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
