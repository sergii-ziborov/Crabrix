name: Crabrix

options:
  bundleIdPrefix: com.sergiiziborov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WasmKit:
    url: https://github.com/swiftwasm/WasmKit.git
    exactVersion: 0.3.1
  SwiftSystem:
    url: https://github.com/apple/swift-system.git
    exactVersion: 1.8.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

targets:
  Crabrix:
    type: application
    platform: iOS
    sources:
      - path: Crabrix
        excludes:
          - Resources/Toolchain
      - path: Crabrix/Resources/Toolchain
        type: folder
        buildPhase: resources
      - path: CrabrixShared
    info:
      path: Crabrix/Resources/Info.plist
      properties:
        CFBundleDisplayName: Crabrix
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        LSSupportsOpeningDocumentsInPlace: true
        NSHumanReadableCopyright: "© 2026 Serhii Ziborov. All rights reserved."
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Crabrix Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.sergiiziborov.crabrix.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sergiiziborov.crabrix.project
            UTTypeDescription: Crabrix Rust Project
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - crabrixproject
    dependencies:
      - target: CrabrixShare
        embed: true
      - package: WasmKit
        product: WasmKit
      - package: WasmKit
        product: WasmKitWASI
      - package: SwiftSystem
        product: SystemPackage
      - package: ZIPFoundation
        product: ZIPFoundation
    preBuildScripts:
      - name: Prepare bundled Rust toolchain
        script: |
          "$SRCROOT/scripts/fetch_toolchain.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.Crabrix
        PRODUCT_NAME: Crabrix
        MARKETING_VERSION: 0.1.8
        CURRENT_PROJECT_VERSION: 14
        CODE_SIGN_ENTITLEMENTS: Crabrix/Crabrix.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crabrix
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic

  CrabrixShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CrabrixShare
        excludes:
          - Info.plist
      - path: CrabrixShared
    info:
      path: CrabrixShare/Info.plist
      properties:
        CFBundleDisplayName: Crabrix
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Serhii Ziborov. All rights reserved."
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.Crabrix.Share
        PRODUCT_NAME: CrabrixShare
        MARKETING_VERSION: 0.1.8
        CURRENT_PROJECT_VERSION: 14
        CODE_SIGN_ENTITLEMENTS: CrabrixShare/CrabrixShare.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  CrabrixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrabrixTests
    dependencies:
      - target: Crabrix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.CrabrixTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Crabrix:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
    run:
      config: Release
    test:
      targets:
        - name: CrabrixTests
          skippedTests:
            - BundledCompilerGateTests/testBundledRustcProducesE0502()
            - BundledCompilerGateTests/testBundledRustcCompilesAndRunsRepairedProgram()
            - BundledCompilerGateTests/testBundledRustcCompilesMultiFileProject()
            - BundledCompilerGateTests/testBundledRustcSurvivesRepeatedBuilds()
            - BundledCompilerGateTests/testUserProgramCannotGrowPastSandboxMemoryLimit()

  CrabrixCompilerGate:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
    test:
      environmentVariables:
        CRABRIX_RUN_COMPILER_GATE: "1"
      targets:
        - name: CrabrixTests
          selectedTests:
            - BundledCompilerGateTests/testBundledRustcProducesE0502()
            - BundledCompilerGateTests/testBundledRustcCompilesAndRunsRepairedProgram()
            - BundledCompilerGateTests/testBundledRustcCompilesMultiFileProject()
            - BundledCompilerGateTests/testBundledRustcSurvivesRepeatedBuilds()
            - BundledCompilerGateTests/testUserProgramCannotGrowPastSandboxMemoryLimit()
