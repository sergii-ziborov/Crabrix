name: Crabrix

configs:
  Debug: debug
  Release: release
  CompilerCandidate: release

options:
  bundleIdPrefix: com.sergiiziborov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The fold reserved-region API first appears in the iOS 27.1 SDK. The
    # Xcode 27.0 CI image keeps building the ordinary size-class layout.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.1*]: "$(inherited) CRABRIX_DUO_SDK"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.1*]: "$(inherited) CRABRIX_DUO_SDK"
  configs:
    # Game Center is compiled in both configurations but remains opt-in.
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CRABRIX_SOCIAL
    release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CRABRIX_SOCIAL"
    CompilerCandidate:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CRABRIX_SOCIAL CRABRIX_LEGACY_FIXTURES"

packages:
  WasmKit:
    # Public Crabrix fork of WasmKit 0.4.1 with read-only host WASI preopens.
    url: https://github.com/sergii-ziborov/crabrix-runtime.git
    revision: 7d0f6718597c1a1228efca3591ae91d13c6d569b
  SwiftSystem:
    url: https://github.com/apple/swift-system.git
    exactVersion: 1.8.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

targets:
  Crabrix:
    type: application
    platform: iOS
    sources:
      - path: Crabrix
        excludes:
          - Resources/Toolchain
          - Resources/MigrationCoursePacks
          - Resources/ActiveCourseCatalog
      - path: Crabrix/Resources/MigrationCoursePacks
        type: folder
        buildPhase: resources
      - path: Crabrix/Resources/ActiveCourseCatalog
        type: folder
        buildPhase: resources
      - path: build/Resources/Toolchain
        type: folder
        buildPhase: resources
      - path: CrabrixShared
    info:
      path: Crabrix/Resources/Info.plist
      properties:
        CFBundleDisplayName: Crabrix
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        LSSupportsOpeningDocumentsInPlace: true
        NSHumanReadableCopyright: "© 2026 Serhii Ziborov. All rights reserved."
        NSFaceIDUsageDescription: "Unlock your local Crabrix projects and courses."
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Crabrix Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.sergiiziborov.crabrix.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sergiiziborov.crabrix.project
            UTTypeDescription: Crabrix Rust Project
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - crabrixproject
    dependencies:
      - target: CrabrixShare
        embed: true
      - package: WasmKit
        product: WasmKit
      - package: WasmKit
        product: WasmKitWASI
      - package: SwiftSystem
        product: SystemPackage
      - package: ZIPFoundation
        product: ZIPFoundation
    preBuildScripts:
      - name: Prepare bundled Rust toolchain
        script: |
          set -eu
          "$SRCROOT/scripts/fetch_toolchain.sh"
          /usr/bin/python3 "$SRCROOT/scripts/package_toolchain.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.Crabrix
        PRODUCT_NAME: Crabrix
        MARKETING_VERSION: 1.1.2
        CURRENT_PROJECT_VERSION: 73
        CODE_SIGN_ENTITLEMENTS: Crabrix/Crabrix.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crabrix
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
      configs:
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(CRABRIX_APP_PROFILE)"

  CrabrixShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CrabrixShare
        excludes:
          - Info.plist
      - path: CrabrixShared
    info:
      path: CrabrixShare/Info.plist
      properties:
        CFBundleDisplayName: Crabrix
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Serhii Ziborov. All rights reserved."
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.Crabrix.Share
        PRODUCT_NAME: CrabrixShare
        MARKETING_VERSION: 1.1.2
        CURRENT_PROJECT_VERSION: 73
        CODE_SIGN_ENTITLEMENTS: CrabrixShare/CrabrixShare.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(CRABRIX_SHARE_PROFILE)"

  CrabrixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrabrixTests
        excludes:
          - CompilerCandidate
      - path: CrabrixTests/CompilerCandidate
        type: folder
        buildPhase: resources
    dependencies:
      - target: Crabrix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.CrabrixTests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        release:
          # Keep the compiler/app and runtime optimized. Optimizing this large
          # XCTest driver adds minutes to each candidate rebuild without
          # affecting the guest interpreter that is being measured.
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_COMPILATION_MODE: incremental
        CompilerCandidate:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_COMPILATION_MODE: incremental

  CrabrixScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CrabrixScreenshotTests
    dependencies:
      - target: Crabrix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.CrabrixScreenshotTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CrabrixBuildWorkspaceGate:
    build:
      targets:
        Crabrix: all
        CrabrixScreenshotTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: CrabrixScreenshotTests
          selectedTests:
            - BuildWorkspaceTests

  CrabrixBuildProblemsGate:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
        CrabrixScreenshotTests: [test]
    test:
      gatherCoverageData: false
      environmentVariables:
        CRABRIX_RUN_COMPILER_GATE: "1"
      targets:
        - name: CrabrixTests
          selectedTests:
            - BuildProblemsTests
            - CargoManifestEditorTests
            - ProjectAuthoringTests/testExistingPlainSynDependencyCanBeRepairedInProject()
        - name: CrabrixScreenshotTests
          selectedTests:
            - BuildWorkspaceTests

  CrabrixInteractionGate:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: CrabrixTests
          selectedTests:
            - AppLockTests
            - TermMatchConnectionTests

  CrabrixScreenshots:
    build:
      targets:
        Crabrix: all
        CrabrixScreenshotTests: [test]
    test:
      targets:
        - name: CrabrixScreenshotTests
          selectedTests:
            - ReleaseScreenshotTests/testReleaseScreenshotsAndLegalReaders()
      gatherCoverageData: false

  CrabrixDuoScreenshots:
    build:
      targets:
        Crabrix: all
        CrabrixScreenshotTests: [test]
    test:
      targets:
        - name: CrabrixScreenshotTests
          selectedTests:
            - ReleaseScreenshotTests/testDuoDisplayScreenshots()
      gatherCoverageData: false

  Crabrix:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
    run:
      config: Release
    test:
      targets:
        - name: CrabrixTests
          skippedTests:
            - BundledCompilerGateTests/testSuccessfulLessonRunClearsPreviousErrorWithoutCompletingLesson()
            - BundledCompilerGateTests/testSwitchingFilesDuringCompilationKeepsItsResult()
            - BundledCompilerGateTests/testHashbrownFromDeviceReportResolvesAndRuns()
            - BundledCompilerGateTests/testBundledRustcProducesE0502()
            - BundledCompilerGateTests/testBundledRustcCompilesAndRunsRepairedProgram()
            - BundledCompilerGateTests/testUserProgramOutputStopsAtWASIWriteBudget()
            - BundledCompilerGateTests/testBundledRustcCompilesMultiFileProject()
            - BundledCompilerGateTests/testRootCargoPackageEnvironmentComesFromTheManifest()
            - BundledCompilerGateTests/testRootFeaturesReachTheRootCrate()
            - BundledCompilerGateTests/testAlgorithmSolutionRunsOnlyThroughThePrivateHarness()
            - BundledCompilerGateTests/testBundledRustcSurvivesRepeatedBuilds()
            - BundledCompilerGateTests/testEveryInstalledAcademyExampleBuildsAndRuns()
            - BundledCompilerGateTests/testUserProgramCannotGrowPastSandboxMemoryLimit()
            - BundledCompilerGateTests/testResolvesDownloadsAndLinksARealCratesIOPackage()
            - BundledCompilerGateTests/testMultiCrateCollectionsAndJSONApplicationBuildsAndRuns()
            - BundledCompilerGateTests/testVendoredCrateBuildsFromAProjectLocalPatch()
            - BundledCompilerGateTests/testOfflinePinRehydratesSourcesAfterPurgeableCacheEviction()
            - BundledCompilerGateTests/testStopInterruptsARunningCompile()
            - BundledCompilerGateTests/testViewModelStopReenablesBuildAfterWorkerDrains()
            - BundledCompilerGateTests/testVisualPixelSunsetRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualCellularGardenRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualMandelbrotRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualConstellationRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualTerrainRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualColorWavesRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualCreateTemplateRendersAValidatedCanvas()

  CrabrixCompilerGate:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
    test:
      environmentVariables:
        CRABRIX_RUN_COMPILER_GATE: "1"
      targets:
        - name: CrabrixTests
          selectedTests:
            - BundledCompilerGateTests/testRunKeepsMainActorResponsiveAtUserInitiatedPriority()
            - BundledCompilerGateTests/testTokioCurrentThreadTimersAndChannelsRunOffline()
            - BundledCompilerGateTests/testSerdeJSONBuildScriptRunsInsideTheOfflineWASISandbox()
            - OfflineWebPreviewTests
            - SyntaxHighlighterTests
            - RustCompletionTests
            - CargoBuildScriptTests
            - BundledCompilerGateTests/testRustGeneratesAnOfflineHTMLCSSJavaScriptPreview()
            - BundledCompilerGateTests/testProjectBuildScriptTracksInputsAndExposesGeneratedCodeAndCfg()
            - BundledCompilerGateTests/testMarkdownAndTemplatesRenderARealHTMLPageOffline()
            - BundledCompilerGateTests/testAxumRoutesARealHTTPRequestWithoutATCPServer()
            - BundledCompilerGateTests/testSuccessfulLessonRunClearsPreviousErrorWithoutCompletingLesson()
            - BundledCompilerGateTests/testSwitchingFilesDuringCompilationKeepsItsResult()
            - BundledCompilerGateTests/testHashbrownFromDeviceReportResolvesAndRuns()
            - BundledCompilerGateTests/testBundledRustcProducesE0502()
            - BundledCompilerGateTests/testBundledRustcCompilesAndRunsRepairedProgram()
            - BundledCompilerGateTests/testBundledRustcCompilesMultiFileProject()
            - BundledCompilerGateTests/testRootCargoPackageEnvironmentComesFromTheManifest()
            - BundledCompilerGateTests/testRootFeaturesReachTheRootCrate()
            - BundledCompilerGateTests/testAlgorithmSolutionRunsOnlyThroughThePrivateHarness()
            - BundledCompilerGateTests/testBundledRustcSurvivesRepeatedBuilds()
            - BundledCompilerGateTests/testEveryInstalledAcademyExampleBuildsAndRuns()
            - BundledCompilerGateTests/testUserProgramCannotGrowPastSandboxMemoryLimit()
            - BundledCompilerGateTests/testResolvesDownloadsAndLinksARealCratesIOPackage()
            - BundledCompilerGateTests/testVendoredCrateBuildsFromAProjectLocalPatch()
            - BundledCompilerGateTests/testOfflinePinRehydratesSourcesAfterPurgeableCacheEviction()
            - BundledCompilerGateTests/testStopInterruptsARunningCompile()
            - BundledCompilerGateTests/testViewModelStopReenablesBuildAfterWorkerDrains()
            - BundledCompilerGateTests/testVisualPixelSunsetRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualCellularGardenRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualMandelbrotRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualConstellationRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualTerrainRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualColorWavesRendersAValidatedCanvas()
            - BundledCompilerGateTests/testVisualCreateTemplateRendersAValidatedCanvas()

  CrabrixCompilerCandidateGate:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
    test:
      config: CompilerCandidate
      gatherCoverageData: false
      environmentVariables:
        CRABRIX_RUN_COMPILER_CANDIDATE: "1"
        CRABRIX_PERF_TRACE: "1"
      targets:
        - name: CrabrixTests
          selectedTests:
            - CompilerCandidateGateTests

  CrabrixCourseDeliveryGate:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
    test:
      environmentVariables:
        CRABRIX_RUN_COURSE_FETCH: "1"
      targets:
        - name: CrabrixTests
          selectedTests:
            - CourseDeliveryGateTests/testPublicSignedCatalogAndCourseInstall()
            - CourseDeliveryGateTests/testPublicExamplesUpgradeKeepsEditedProjectAndLoadsEveryInfographic()
            - CourseDeliveryGateTests/testPublicConstellationGeneratorCompilesAndRendersRepeatableCanvas()
            - CourseDeliveryGateTests/testPublicArchiveResumesFromPersistedRange()

  CrabrixLegalGate:
    build:
      targets:
        Crabrix: all
        CrabrixTests: [test]
    test:
      targets:
        - name: CrabrixTests
          selectedTests:
            - BundledLicenseTests
