name: crabrix-web

services:
  site:
    build:
      context: .
      dockerfile: hetzner/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CRABRIX_SITE_PORT:-3212}:8080"
    environment:
      SITE_ORIGIN: https://crabrix.com
      AUTH_DB_PATH: /data/accounts.sqlite
    volumes:
      - /srv/apps/crabrix-site/accounts:/data:rw
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
