<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0f14; color: #eaf0f7; text-align: center; padding: 24px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  .code { font: 700 68px/1 ui-monospace, monospace; color: #ff6b4a; letter-spacing: -.03em; }
  h1 { font-size: 24px; margin: 18px 0 8px; letter-spacing: -.02em; }
  p { color: #93a4b8; margin: 0 0 26px; }

    display: inline-block; text-decoration: none; font-weight: 650;
    padding: 11px 20px; border-radius: 999px; background: #ff6b4a; color: #16110f;
  }

  /* ---- Light appearance ------------------------------------------------ */
  /* Follows the operating system only: no toggle, no switch, no stored
     preference. The dark values above stay the default. */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f9fc;
      --panel: #eef2f7;
      --raised: #e5ebf3;
      --border: #d2dbe8;
      --text: #0e1620;
      --muted: #3f5062;
      --coral: #b8350f;
      --mint: #0c6349;
      --blue: #0a52a6;
      --amber: #7a4e00;
    }
    header { background: rgba(247,249,252,.86); }
    code {
      background: var(--raised); border: 1px solid var(--border);
      border-radius: 5px; padding: .06em .32em;
    }
    .eyebrow { color: var(--mint); }
    tbody tr:hover { background: rgba(10,82,166,.06); }
    .pip { background: rgba(12,99,73,.12); }

    .contact-form .send { color: #fff; }

      border: 1px solid var(--border); border-radius: 14px; background: var(--raised);
    }
