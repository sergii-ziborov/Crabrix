[package]
name = "crabrix-semantic-core"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[workspace]
[dependencies]
ide = { path = "../rust-analyzer/crates/ide" }
hir = { path = "../rust-analyzer/crates/hir" }
base-db = { path = "../rust-analyzer/crates/base-db" }
cfg = { path = "../rust-analyzer/crates/cfg" }
vfs = { path = "../rust-analyzer/crates/vfs" }
ide-db = { path = "../rust-analyzer/crates/ide-db" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
triomphe = "0.1.17"
[profile.dev]
debug = 0
incremental = false
[profile.release]
debug = 0
strip = "debuginfo"
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "abort"
